services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: envanex-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # No default: a committed password in a public repo is a published credential.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}"
      MSSQL_PID: "Developer"
    ports:
      # Loopback only, so other hosts on the network cannot reach sa.
      - "127.0.0.1:1433:1433"
    volumes:
      - envanex-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  envanex-mssql-data:
